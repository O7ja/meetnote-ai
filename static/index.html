<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MeetNote — AI Meeting Notes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d0f14;
      --surface: #13161e;
      --surface2: #1a1e29;
      --border: #242838;
      --accent: #6c63ff;
      --accent2: #a78bfa;
      --text: #e8eaf0;
      --muted: #6b7280;
      --success: #34d399;
      --warn: #fbbf24;
      --danger: #f87171;
      --radius: 12px;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 18px 32px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }
    .logo {
      width: 32px; height: 32px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px;
    }
    header h1 { font-size: 1.1rem; font-weight: 600; letter-spacing: -0.3px; }
    header span { font-size: 0.75rem; color: var(--muted); margin-left: 4px; }

    /* ── Layout ── */
    .container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0;
      flex: 1;
      height: calc(100vh - 61px);
    }

    /* ── Left Panel ── */
    .panel {
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--border);
      overflow: hidden;
    }
    .panel-header {
      padding: 16px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .panel-title { font-size: 0.8rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.8px; }

    textarea {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      resize: none;
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 0.875rem;
      line-height: 1.7;
      padding: 20px 24px;
    }
    textarea::placeholder { color: var(--muted); }

    .panel-footer {
      padding: 16px 24px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* Upload button */
    .btn-upload {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface2);
      color: var(--muted);
      font-size: 0.8rem;
      cursor: pointer;
      transition: all .15s;
    }
    .btn-upload:hover { border-color: var(--accent); color: var(--accent2); }
    #file-input { display: none; }

    /* Generate button */
    #generate-btn {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px 20px;
      border-radius: 8px;
      border: none;
      background: linear-gradient(135deg, var(--accent), #7c3aed);
      color: #fff;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity .15s, transform .1s;
    }
    #generate-btn:hover { opacity: 0.9; transform: translateY(-1px); }
    #generate-btn:active { transform: translateY(0); }
    #generate-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    /* Spinner */
    .spinner {
      width: 14px; height: 14px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      display: none;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Right Panel ── */
    .output-panel {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .output-panel .panel-header { justify-content: space-between; }

    #download-btn {
      display: none;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 7px;
      border: 1px solid var(--border);
      background: var(--surface2);
      color: var(--accent2);
      font-size: 0.75rem;
      font-weight: 500;
      cursor: pointer;
      transition: all .15s;
    }
    #download-btn:hover { border-color: var(--accent2); background: var(--surface); }
    #download-btn.visible { display: flex; }

    .output-body {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
    }
    .output-body::-webkit-scrollbar { width: 6px; }
    .output-body::-webkit-scrollbar-track { background: transparent; }
    .output-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    /* Empty state */
    .empty-state {
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: var(--muted);
    }
    .empty-icon { font-size: 3rem; opacity: 0.4; }
    .empty-state p { font-size: 0.875rem; text-align: center; max-width: 240px; line-height: 1.6; }

    /* Loading state */
    .loading-state {
      display: none;
      height: 100%;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      color: var(--muted);
    }
    .loading-ring {
      width: 48px; height: 48px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .9s linear infinite;
    }
    .loading-state p { font-size: 0.875rem; }
    .loading-dots::after {
      content: '';
      animation: dots 1.5s steps(3, end) infinite;
    }
    @keyframes dots {
      0%   { content: ''; }
      33%  { content: '.'; }
      66%  { content: '..'; }
      100% { content: '...'; }
    }

    /* Error state */
    .error-banner {
      display: none;
      background: rgba(248, 113, 113, 0.1);
      border: 1px solid rgba(248, 113, 113, 0.3);
      border-radius: 8px;
      padding: 12px 16px;
      font-size: 0.8rem;
      color: var(--danger);
      margin-bottom: 16px;
    }

    /* Notes output */
    #notes-output { display: none; }

    .notes-title {
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
      line-height: 1.3;
    }
    .notes-meta {
      font-size: 0.8rem;
      color: var(--muted);
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 24px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
    }
    .meta-item { display: flex; align-items: center; gap: 5px; }

    .section { margin-bottom: 24px; }
    .section-label {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--accent2);
      margin-bottom: 10px;
    }
    .summary-text {
      font-size: 0.875rem;
      line-height: 1.75;
      color: #c4c9d8;
    }

    /* Chips */
    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.75rem;
      border: 1px solid var(--border);
      background: var(--surface2);
      color: var(--text);
    }
    .chip-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }

    /* Decision list */
    .decision-list { display: flex; flex-direction: column; gap: 8px; }
    .decision-item {
      display: flex;
      gap: 10px;
      font-size: 0.85rem;
      line-height: 1.5;
    }
    .decision-item::before { content: '→'; color: var(--accent2); flex-shrink: 0; margin-top: 1px; }

    /* Action items */
    .action-list { display: flex; flex-direction: column; gap: 8px; }
    .action-card {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 0.82rem;
    }
    .action-check {
      width: 16px; height: 16px;
      border-radius: 4px;
      border: 2px solid var(--border);
      flex-shrink: 0;
      margin-top: 2px;
    }
    .action-body { flex: 1; }
    .action-task { font-weight: 500; margin-bottom: 3px; }
    .action-meta { color: var(--muted); font-size: 0.75rem; display: flex; gap: 12px; flex-wrap: wrap; }
    .action-badge {
      padding: 2px 7px;
      border-radius: 4px;
      background: rgba(108, 99, 255, 0.15);
      color: var(--accent2);
      font-size: 0.7rem;
      font-weight: 500;
    }

    /* Blocker list */
    .blocker-list { display: flex; flex-direction: column; gap: 6px; }
    .blocker-item {
      display: flex;
      gap: 10px;
      font-size: 0.85rem;
      line-height: 1.5;
      color: #fcd34d;
    }
    .blocker-item::before { content: '⚠'; flex-shrink: 0; }

    .next-meeting {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      background: rgba(52, 211, 153, 0.1);
      border: 1px solid rgba(52, 211, 153, 0.25);
      border-radius: 8px;
      padding: 8px 14px;
      color: var(--success);
    }

    /* Char count */
    #char-count { font-size: 0.75rem; color: var(--muted); }
  </style>
</head>
<body>

<header>
  <div class="logo">📝</div>
  <h1>MeetNote</h1>
  <span>AI-powered meeting notes</span>
</header>

<div class="container">

  <!-- LEFT: Input -->
  <div class="panel">
    <div class="panel-header">
      <span class="panel-title">Transcript</span>
      <span id="char-count">0 chars</span>
    </div>

    <textarea id="transcript-input" placeholder="Paste your meeting transcript here…&#10;&#10;Example:&#10;Sarah: Let's get started…&#10;John: The main agenda is…"></textarea>

    <div class="panel-footer">
      <label class="btn-upload" for="file-input">
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        Upload .txt
      </label>
      <input type="file" id="file-input" accept=".txt" />

      <button id="generate-btn">
        <div class="spinner" id="spinner"></div>
        <svg id="btn-icon" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
        Generate Notes
      </button>
    </div>
  </div>

  <!-- RIGHT: Output -->
  <div class="panel output-panel">
    <div class="panel-header">
      <span class="panel-title">Meeting Notes</span>
      <button id="download-btn">
        <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Download .md
      </button>
    </div>

    <div class="output-body">
      <div class="error-banner" id="error-banner"></div>

      <!-- Empty -->
      <div class="empty-state" id="empty-state">
        <div class="empty-icon">🗒️</div>
        <p>Paste a transcript on the left and click <strong>Generate Notes</strong></p>
      </div>

      <!-- Loading -->
      <div class="loading-state" id="loading-state">
        <div class="loading-ring"></div>
        <p>Analyzing transcript<span class="loading-dots"></span></p>
      </div>

      <!-- Notes -->
      <div id="notes-output"></div>
    </div>
  </div>

</div>

<script>
  const textarea = document.getElementById('transcript-input');
  const fileInput = document.getElementById('file-input');
  const generateBtn = document.getElementById('generate-btn');
  const spinner = document.getElementById('spinner');
  const btnIcon = document.getElementById('btn-icon');
  const charCount = document.getElementById('char-count');
  const emptyState = document.getElementById('empty-state');
  const loadingState = document.getElementById('loading-state');
  const notesOutput = document.getElementById('notes-output');
  const errorBanner = document.getElementById('error-banner');
  const downloadBtn = document.getElementById('download-btn');

  let lastMarkdown = '';

  // Char count
  textarea.addEventListener('input', () => {
    charCount.textContent = textarea.value.length.toLocaleString() + ' chars';
  });

  // File upload
  fileInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      textarea.value = ev.target.result;
      charCount.textContent = textarea.value.length.toLocaleString() + ' chars';
    };
    reader.readAsText(file);
  });

  // Generate
  generateBtn.addEventListener('click', async () => {
    const transcript = textarea.value.trim();
    if (!transcript) { showError('Please enter a transcript first.'); return; }

    setLoading(true);
    hideError();

    try {
      const res = await fetch('/api/generate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ transcript })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Server error');
      lastMarkdown = data.markdown;
      renderNotes(data.notes);
      downloadBtn.classList.add('visible');
    } catch (err) {
      showError(err.message);
      showEmpty();
    } finally {
      setLoading(false);
    }
  });

  // Download
  downloadBtn.addEventListener('click', () => {
    const blob = new Blob([lastMarkdown], { type: 'text/markdown' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'meeting_notes.md';
    a.click();
  });

  function setLoading(on) {
    generateBtn.disabled = on;
    spinner.style.display = on ? 'block' : 'none';
    btnIcon.style.display = on ? 'none' : 'block';
    emptyState.style.display = 'none';
    loadingState.style.display = on ? 'flex' : 'none';
    if (on) notesOutput.style.display = 'none';
  }

  function showEmpty() {
    emptyState.style.display = 'flex';
    notesOutput.style.display = 'none';
  }

  function showError(msg) {
    errorBanner.textContent = msg;
    errorBanner.style.display = 'block';
  }

  function hideError() {
    errorBanner.style.display = 'none';
  }

  function esc(str) {
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function renderNotes(n) {
    loadingState.style.display = 'none';
    emptyState.style.display = 'none';
    notesOutput.style.display = 'block';

    const participants = (n.participants || []).map(p =>
      `<span class="chip"><span class="chip-dot"></span>${esc(p)}</span>`
    ).join('');

    const decisions = (n.key_decisions || []).map(d =>
      `<div class="decision-item">${esc(d)}</div>`
    ).join('');

    const actions = (n.action_items || []).map(a =>
      `<div class="action-card">
        <div class="action-check"></div>
        <div class="action-body">
          <div class="action-task">${esc(a.task || 'Task')}</div>
          <div class="action-meta">
            <span>👤 ${esc(a.owner || 'TBD')}</span>
            <span class="action-badge">Due: ${esc(a.due || 'TBD')}</span>
          </div>
        </div>
      </div>`
    ).join('');

    const blockers = (n.blockers || []).filter(b => b && b.toLowerCase() !== 'none').map(b =>
      `<div class="blocker-item">${esc(b)}</div>`
    ).join('');

    const nextMeeting = n.next_meeting && n.next_meeting !== 'TBD'
      ? `<div class="section"><div class="section-label">Next Meeting</div>
           <div class="next-meeting">📅 ${esc(n.next_meeting)}</div></div>`
      : '';

    notesOutput.innerHTML = `
      <div class="notes-title">${esc(n.meeting_title || 'Meeting Notes')}</div>
      <div class="notes-meta">
        <span class="meta-item">📅 ${esc(n.date || '—')}</span>
        <span class="meta-item">⏱ ${esc(n.duration_estimate || '—')}</span>
        <span class="meta-item">👥 ${(n.participants||[]).length} participants</span>
      </div>

      ${participants ? `<div class="section"><div class="section-label">Participants</div><div class="chips">${participants}</div></div>` : ''}

      <div class="section">
        <div class="section-label">Summary</div>
        <p class="summary-text">${esc(n.summary || '')}</p>
      </div>

      ${decisions ? `<div class="section"><div class="section-label">Key Decisions</div><div class="decision-list">${decisions}</div></div>` : ''}

      ${actions ? `<div class="section"><div class="section-label">Action Items</div><div class="action-list">${actions}</div></div>` : ''}

      ${blockers ? `<div class="section"><div class="section-label">Blockers</div><div class="blocker-list">${blockers}</div></div>` : ''}

      ${nextMeeting}
    `;
  }
</script>

</body>
</html>
